<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕的晨间骑行</title>
  <style>
    :root { --ink:#17323c; --sea:#76d5d2; --sun:#ffd36c; --coral:#f17862; --paper:#f7f5ed; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; overflow:hidden; background:#173e50; font-family:ui-rounded, "PingFang SC", "Microsoft YaHei", sans-serif; color:var(--ink); }
    .poster { position:relative; width:min(100vw, 1100px); min-height:100vh; display:grid; place-items:center; overflow:hidden; background:linear-gradient(#93dfdb 0 66%, #f7f5ed 66%); }
    .copy { position:absolute; top:clamp(20px,5vw,58px); left:clamp(24px,7vw,82px); z-index:3; pointer-events:none; }
    h1 { margin:0; font-size:clamp(38px,6vw,78px); line-height:.92; letter-spacing:-.08em; font-weight:900; }
    .sub { margin:13px 0 0 5px; font-size:clamp(12px,1.5vw,16px); letter-spacing:.25em; font-weight:800; }
    .hint { position:absolute; z-index:4; bottom:23px; right:30px; margin:0; font-size:12px; letter-spacing:.1em; opacity:.65; }
    svg { display:block; width:100%; height:auto; overflow:hidden; }
    body { background:#f7f5ed; overflow:auto; min-height:100svh; }
    .poster { min-height:0; width:min(100%,1100px,calc((100svh - 110px)*1.42857)); margin:24px 0; border-radius:24px; background:#93dfdb; box-shadow:0 20px 80px #17323c12; }
    .copy { top:38px; left:6%; }
    .controls { width:100%; background:#f7f5ed; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 6% 28px; flex-wrap:wrap; }
    .hint { position:static; }
    .actions { display:flex; align-items:center; gap:12px; font-size:12px; }
    button { font:inherit; font-weight:600; color:var(--ink); border:1px solid #17323c30; background:transparent; border-radius:999px; padding:10px 18px; cursor:pointer; }
    button:hover { background:#17323c0b; }
    button:focus-visible,input:focus-visible { outline:3px solid #f17862; outline-offset:4px; }
    input { width:80px; accent-color:#e57761; }
    .paused * { animation-play-state:paused!important; }
    @media(max-width:600px) { .poster { width:100%; margin:0; border-radius:0; } h1 { font-size:36px; } .sub { font-size:9px; letter-spacing:.12em; } .copy { top:22px; } .controls { padding-top:16px; } }
    .sun { transform-origin:761px 145px; animation:pulse 3s ease-in-out infinite; }
    .cloud { animation:drift 12s ease-in-out infinite alternate; }
    .cloud.two { animation-delay:-6s; }
    .rays { transform-origin:761px 145px; animation:spin 30s linear infinite; }
    .road { animation:road 1s linear infinite; }
    .head { transform-origin:485px 252px; animation:nod .7s ease-in-out infinite; }
    .wing { transform-origin:446px 352px; animation:wing .7s ease-in-out infinite; }
    .tail { transform-origin:337px 381px; animation:tail .7s ease-in-out infinite; }
    .water-line { animation:water 2.2s ease-in-out infinite alternate; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes ride { 50% { transform:translateY(-7px) rotate(-.8deg); } }
    @keyframes nod { 50% { transform:rotate(3deg) translateY(2px); } }
    @keyframes wing { 50% { transform:rotate(-6deg); } }
    @keyframes tail { 50% { transform:rotate(5deg); } }
    @keyframes drift { to { transform:translateX(40px); } }
    @keyframes pulse { 50% { transform:scale(1.055); } }
    @keyframes water { to { transform:translateX(-24px); } }
    @keyframes road { to { stroke-dashoffset:-64; } }
    @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation-duration:.001ms!important; animation-iteration-count:1!important; } }
  </style>
</head>
<body>
  <main class="poster" aria-label="一只鹈鹕骑自行车的动画插画">
    <header class="copy"><h1>骑向<br>海风</h1><p class="sub">PELICAN ON A BICYCLE</p></header>
    <svg viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
      <title id="title">骑自行车的鹈鹕</title><desc id="desc">一只白色鹈鹕在海边愉快地骑着红色自行车</desc>
      <g opacity=".3" class="rays" stroke="#fff9dc" stroke-width="6" stroke-linecap="round">
        <path d="M760 50v-24M830 76l18-18M850 144h25M824 208l18 18M760 236v24M696 208l-18 18M674 144h-25M696 76l-18-18"/>
      </g>
      <circle class="sun" cx="761" cy="145" r="57" fill="#ffd36c"/>
      <g class="cloud" fill="#eaf8ee" opacity=".85"><path d="M91 190c3-20 19-32 39-29 12-26 51-21 58 8 27-5 45 12 45 31H80c0-5 4-10 11-10z"/></g>
      <g transform="translate(560 26) scale(.72)"><g class="cloud two" fill="#eaf8ee" opacity=".65"><path d="M91 190c3-20 19-32 39-29 12-26 51-21 58 8 27-5 45 12 45 31H80c0-5 4-10 11-10z"/></g></g>
      <path d="M0 418c92-18 168-52 266-23 105 31 146 6 236 15 113 12 163-37 270-11 81 20 146 12 228-7v91H0z" fill="#4caeb4"/>
      <path class="water-line" d="M-30 436c64-20 107 13 162-4s107-16 162 4 107 17 162-3 107-17 162 4 107 17 162-3 107-17 162 4 107 17 162-3" fill="none" stroke="#caeece" stroke-width="7" stroke-linecap="round" opacity=".8"/>
      <path d="M0 500h1000v200H0z" fill="#f7f5ed"/>
      <path d="M0 545h1000" fill="none" stroke="#dae2d4" stroke-width="5"/>
      <path class="road" d="M-10 621h1020" fill="none" stroke="#d9cfc0" stroke-width="7" stroke-linecap="round" stroke-dasharray="34 30"/>
      <g fill="#2b5c57" opacity=".9"><path d="M84 502l13-46 13 46zM121 513l11-38 11 38zM884 510l15-52 15 52zM925 516l10-34 10 34z"/></g>
      <ellipse cx="482" cy="611" rx="226" ry="12" fill="#264a55" opacity=".12"/>
      <path id="far-leg" d="M432 385L492 461L464 515" fill="none" stroke="#c99347" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- bicycle -->
      <g stroke-linecap="round" stroke-linejoin="round">
        <g class="wheel" fill="none" stroke="#264a55" stroke-width="11"><circle cx="350" cy="527" r="77"/><path d="M350 450v154M273 527h154M296 473l108 108M404 473L296 581" stroke="#9ad7d0" stroke-width="3"/></g>
        <g class="wheel" fill="none" stroke="#264a55" stroke-width="11"><circle cx="618" cy="527" r="77"/><path d="M618 450v154M541 527h154M564 473l108 108M672 473L564 581" stroke="#9ad7d0" stroke-width="3"/></g>
        <g fill="none" stroke="#f17862" stroke-width="11"><path d="M350 527L433 417L504 527ZM433 417H601L504 527M433 417L415 384M618 527L588 354L613 337"/></g>
        <path d="M389 382h53" stroke="#264a55" stroke-width="13"/><path d="M614 337h-31" stroke="#264a55" stroke-width="10"/>
        <g class="chainring" fill="#ffd36c" stroke="#264a55" stroke-width="7"><circle cx="504" cy="527" r="23"/><path d="M504 504v46M481 527h46"/></g>
        <path id="crank" d="M464 527H544" stroke="#264a55" stroke-width="7"/><path id="far-pedal" d="M453 527h22" stroke="#264a55" stroke-width="9"/>
      </g>
      <!-- Pelican: long bill, throat pouch, curved neck and a wing on the handlebar. -->
      <g id="rider" stroke-linejoin="round" stroke-linecap="round">
        <path d="M378 337L305 302L322 344L297 344L369 375" fill="#d8eee2" stroke="#264a55" stroke-width="5"/>
        <path d="M467 313C487 282 454 256 473 215C484 190 509 181 535 200C552 214 546 240 530 252C511 269 527 303 512 343C500 378 474 399 428 400C377 401 345 374 350 344C355 309 422 292 467 313Z" fill="#f7fbef" stroke="#264a55" stroke-width="6"/>
        <path d="M481 277C492 298 502 329 478 354" fill="none" stroke="#d6e6db" stroke-width="12"/>
        <g>
          <path d="M531 222L704 244Q686 258 668 259L535 245Z" fill="#f5b65e" stroke="#264a55" stroke-width="5"/>
          <path d="M533 239L683 251Q591 317 550 272Z" fill="#ffd483" stroke="#264a55" stroke-width="5"/>
          <path d="M550 251Q576 279 616 273" fill="none" stroke="#e5a556" stroke-width="3"/>
          <circle cx="515" cy="218" r="6" fill="#18323b"/><circle cx="517" cy="216" r="1.7" fill="white"/>
          <path d="M500 202Q511 196 521 201" fill="none" stroke="#264a55" stroke-width="3"/>
        </g>
        <path d="M413 321Q441 301 476 326Q518 351 590 333Q598 338 585 346Q508 384 447 360Q416 355 413 321Z" fill="#d6e7df" stroke="#264a55" stroke-width="5"/>
        <path d="M441 328Q467 354 511 353M437 340Q458 360 485 361" fill="none" stroke="#a7c7c1" stroke-width="3"/>
        <path d="M480 279Q496 288 518 283L514 296Q493 301 479 293Z" fill="#f17862"/>
        <path d="M485 288Q444 268 414 284L433 295L416 303Q455 303 485 292Z" fill="#f17862"/>
      </g>
      <path id="near-leg" d="M447 387L490 445L544 527" fill="none" stroke="#e5a54e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="near-foot" d="M530 522h28" stroke="#e5a54e" stroke-width="13" stroke-linecap="round"/>
      <path id="near-pedal" d="M532 531h24" stroke="#264a55" stroke-width="7" stroke-linecap="round"/>
    </svg>
    <footer class="controls"><p class="hint">海风刚好，慢慢骑。</p><div class="actions"><button id="toggle" type="button" aria-pressed="false">暂停骑行</button><label for="speed">速度</label><input id="speed" type="range" min="0.5" max="2" step="0.25" value="1" aria-label="骑行速度"><span id="speed-value">1×</span></div></footer>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const motion = matchMedia('(prefers-reduced-motion: reduce)');
    let paused = motion.matches, speed = 1, phase = 0, last = null;
    const wheels = [...document.querySelectorAll('.wheel')];
    const chainring = document.querySelector('.chainring');
    const decorations = document.querySelector('svg').getAnimations({subtree:true});
    function state() {
      document.body.classList.toggle('paused', paused);
      $('toggle').textContent = paused ? '继续骑行' : '暂停骑行';
      $('toggle').setAttribute('aria-pressed', String(paused));
    }
    $('toggle').addEventListener('click', () => { paused = !paused; state(); });
    motion.addEventListener('change', event => { paused = event.matches; state(); });
    $('speed').addEventListener('input', event => {
      speed = Number(event.target.value);
      $('speed-value').textContent = speed + '×';
      decorations.forEach(animation => animation.updatePlaybackRate(speed));
    });
    // Solve two equal-length leg segments, keeping each foot attached to its pedal.
    function leg(id, hx, hy, px, py) {
      const dx = px-hx, dy = py-hy, d = Math.hypot(dx,dy);
      const along = d/2, bend = Math.sqrt(Math.max(0,10000-along*along));
      const kx = hx + along*dx/d + bend*dy/d;
      const ky = hy + along*dy/d - bend*dx/d;
      $(id).setAttribute('d', 'M'+hx+' '+hy+'L'+kx+' '+ky+'L'+px+' '+py);
    }
    function draw() {
      const bob = Math.sin(phase*2)*2;
      $('rider').setAttribute('transform', 'translate(0 '+bob+')');
      const x = 504+38*Math.cos(phase), y = 527+38*Math.sin(phase);
      const fx = 1008-x, fy = 1054-y;
      leg('far-leg',432,385+bob,fx,fy-5);
      leg('near-leg',447,387+bob,x,y-5);
      $('crank').setAttribute('d','M'+fx+' '+fy+'L'+x+' '+y);
      $('near-foot').setAttribute('d','M'+(x-12)+' '+(y-5)+'h26');
      $('near-pedal').setAttribute('d','M'+(x-12)+' '+(y+3)+'h26');
      $('far-pedal').setAttribute('d','M'+(fx-12)+' '+(fy+3)+'h26');
      wheels.forEach((wheel,i) => wheel.setAttribute('transform','rotate('+(phase*180/Math.PI*1.8)+' '+(i?618:350)+' 527)'));
      chainring.setAttribute('transform','rotate('+(phase*180/Math.PI)+' 504 527)');
    }
    function frame(now) {
      if(last!==null && !paused && !document.hidden) phase += Math.min((now-last)/1000,.05)*speed*Math.PI*1.4;
      last = now;
      draw();
      requestAnimationFrame(frame);
    }
    state();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
